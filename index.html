<script>
const DATA = {"nodes": [{"id": "nastya", "g": 1, "x": 1005, "n": "Анастасия Игоревна", "s": "Настя", "st": "living", "c": null, "unk": false, "name": "Комарова Анастасия Игоревна", "years": "", "body": "", "docs": [], "sibs": []}, {"id": "igor", "g": 2, "x": 490, "n": "Игорь Викторович", "s": "отец", "st": "living", "c": "nastya", "unk": false, "name": "Комаров Игорь Викторович", "years": "", "body": "", "docs": [], "sibs": []}, {"id": "irina", "g": 2, "x": 1520, "n": "Ирина Ивановна", "s": "мать", "st": "living", "c": "nastya", "unk": false, "name": "Комарова (Снимщикова) Ирина Ивановна", "years": "", "body": "", "docs": [], "sibs": [{"n": "Геннадий", "d": "", "st": "living"}]}, {"id": "viktor", "g": 3, "x": 300, "n": "Виктор", "s": "дед по отцу", "st": "living", "c": "igor", "unk": false, "name": "Виктор", "years": "", "body": "", "docs": [], "sibs": []}, {"id": "larisa", "g": 3, "x": 686, "n": "Лариса Николаевна", "s": "бабушка по отцу", "st": "living", "c": "igor", "unk": false, "name": "Карелина (Комарова) Лариса Николаевна", "years": "", "body": "", "docs": [], "sibs": [{"n": "Софья Николаевна", "d": "", "st": "living"}]}, {"id": "ivan", "g": 3, "x": 1300, "n": "Иван Федорович", "s": "Снимщиков · 1942–2009", "st": "one", "c": "irina", "unk": false, "name": "Снимщиков Иван Федорович", "years": "1942–2009 · дед по матери", "body": "\n        <p>Отец Ирины Ивановны. По документам родился <b>18.07.1942<\/b>, а по словам его сестёр — на самом деле в июле 1941 года, в деревне <b>Реплата (Репецкая Плата)<\/b> Курской области, ныне Мантуровский район. Отец — Федор, мать — Елена Ивановна Коршикова; братья Семен и Николай, сёстры Надежда, Ксения и Ольга.<\/p>\n        <p>После войны семья без отца переехала в Луховицы Московской области. Старшая сестра Надежда вышла замуж за украинца (Архипчук) и уехала в Фастов, за ней уехала часть семьи; Иван, уже взрослым, — тоже. В Фастове он женился на Галине Павловне Зайчук. Другая часть семьи осела в Москве и Реутове. Умер <b>8.05.2009<\/b> в Москве, похоронен на Хованском кладбище.<\/p>\n        <p><b>Надгробие.<\/b> На Find a Grave есть запись «И Ф Снимщиков, 18.06.1942 – 08.05.2009», Хованское, Центральное, участок ЗИ/121/45А/0146. Дата смерти и кладбище совпадают с рассказом семьи день в день, поэтому это он. Месяц рождения на надгробии — июнь, по документам — июль; вероятно, ошибка в надписи или при переписи.<\/p>\n        <p><b>Репецкая Плата.<\/b> Снимщиковы — коренная фамилия этого села, они жили там как минимум с XVIII века (Тимский уезд Курской губернии). Метрические книги Архангельской церкви за 1874–1913 годы хранятся в ГАКО.<\/p>\n        <p class=\"src\">Ответы Ирины Ивановны через Настю, 02.11.2026 · <a href=\"https://www.findagrave.com/memorial/321706498\">Find a Grave: И Ф Снимщиков<\/a> · <a href=\"https://familio.org/surnames/c4c84f56-0d04-4053-bd7a-fd5d4cc6e7bb\">Familio — Снимщиковы<\/a> · <a href=\"https://nashipredki.com/church/4849\">Архангельская церковь Репецкой Платы<\/a><\/p><h4>Братья и сёстры деда Ивана<\/h4><ul>\n        <li><b>Семен Федорович<\/b> — старший брат, жил в Москве.<\/li>\n        <li><b>Николай Федорович Снимщиков.<\/b><\/li>\n        <li><b>Надежда Федоровна Архипчук<\/b> — старшая дочь; вышла замуж за украинца и уехала в Фастов, за ней — часть семьи.<\/li>\n        <li><b>Ксения Федоровна<\/b> — жила в Москве. Её отчество первым дало отчество деда.<\/li>\n        <li><b>Ольга Федоровна<\/b> — жила в Реутове.<\/li><\/ul><p class=\"src\">Со слов Насти (30.10) и Ирины Ивановны (02.11.2026)<\/p>", "docs": [{"id": "A-0068", "t": "Find a Grave: «И Ф Снимщиков», 18.06.1942 – 08.05.2009, Хованское кладбище", "ref": "Хованское, Центральное, ЗИ/121/45А/0146", "d": "2009", "url": "https://www.findagrave.com/memorial/321706498", "imgs": []}], "sibs": [{"n": "Надежда, Ксения, Ольга", "d": "Надежда, Ксения, Ольга — сёстры", "st": "fam"}, {"n": "Семен, Николай", "d": "Семен, Николай — братья", "st": "fam"}]}, {"id": "galina", "g": 3, "x": 1746, "n": "Галина Павловна", "s": "бабушка по матери", "st": "living", "c": "irina", "unk": false, "name": "Снимщикова (Зайчук) Галина Павловна", "years": "", "body": "", "docs": [], "sibs": [{"n": "Лидия и 2 брата", "d": "", "st": "living"}, {"n": "Татьяна", "d": "Татьяна — ум. в младенчестве", "st": "fam"}]}, {"id": "viktorpar", "g": 4, "x": 300, "n": "родители Виктора", "s": "неизвестны", "st": "fam", "c": "viktor", "unk": true, "name": "родители Виктора", "years": "", "body": "<p>Подробности — в общей карточке: <button type=\"button\" data-go=\"viktor\">Виктор<\/button><\/p>", "docs": [], "sibs": []}, {"id": "nikolay", "g": 4, "x": 582, "n": "Николай Егорович", "s": "Комаров · 26.02.1923", "st": "one", "c": "larisa", "unk": false, "name": "Комаров Николай Егорович", "years": "26.02.1923 – ?", "body": "\n        <p>Отец Ларисы и Софьи, муж Эльвины Шутисс. По словам Насти, отчество Егорович, родом «из Дмитровской области».<\/p>\n        <p><b>Запись о рождении.<\/b> В актах Рогачёвского волисполкома за 1923 год есть запись № 115 от 27 февраля: «Комаров Николай», мужского пола, родился 26 февраля 1923 года в Рогачёвской лечебнице. Отец — Комаров Егор Петрович, 32 года; мать — Комарова Наталья Алексеевна, 21 год; живут в деревне Телешово. Дата и деревня день в день совпадают с карточкой офицера из военного архива. Значит, военный документ и запись о рождении относятся к одному человеку, и это подтверждено двумя независимыми источниками.<\/p>\n        <p><b>Военная служба.<\/b> В базе «Память народа» есть Комаров Николай Егорович, родившийся 26 февраля 1923 года в деревне Телешово Дмитровского района Московской области, русский. 29 октября 1941 года его призвал Коммунистический райвоенкомат Московской области. С ноября 1944 года он на фронте, в 8-й гвардейской Панфиловской дивизии 2-го Прибалтийского фронта: гвардии лейтенант, командир взвода пулемётной роты 30-го гвардейского стрелкового полка, кандидат в члены партии с 1944 года. В боях 23–26 декабря 1944 года у деревни в Салдусском уезде Латвии (Курляндия) он умело управлял взводом и отбил контратаку, лично уничтожив из станкового пулемёта до 11 солдат противника. 26 декабря был ранен. Приказом от 21 января 1945 года награждён орденом Красной Звезды. После ещё одного ранения 27 апреля 1945 года выписан из госпиталя ЭГ 3143; той же датой в картотеке офицеров отмечено окончание службы. В 1985 году получил юбилейный орден Отечественной войны I степени, значит, был тогда жив.<\/p>\n        <p class=\"flag\">Кто этот человек, установлено по документам. Но то, что именно он отец Ларисы и Софьи, пока известно только из семейной памяти: совпадают имя, отчество и Дмитров. Из того же Телешовского сельсовета есть ещё лейтенант Комаров Николай Егорович 1916 года рождения; по годам он тоже мог бы быть отцом. Окончательно связь подтвердит свидетельство о рождении Ларисы или Софьи, надгробие или семейное фото с наградами. Отдельно замечу: он воевал в Латвии. Это любопытно рядом с версией «Эльвира из Латвии», но ничего не доказывает.<\/p>\n        <p class=\"src\"><a href=\"https://ya.ru/archive/catalog/778c6a12-fe44-447a-86a9-508d0725836d/117\">Акт о рождении: ЦГАМО ф.252 оп.1 д.317, скан 117, запись №115<\/a> (inputs/yandex-archive/cgamo-252-1-317-*.png) · <a href=\"https://pamyat-naroda.ru/heroes/podvig-chelovek_nagrazhdenie36647968/\">Наградной лист и приказ 8 гв. сд № 06/н от 21.01.1945<\/a> (inputs/pamyat-naroda/komarov-ne-1923-nagradnoy-list-*.png) · <a href=\"https://pamyat-naroda.ru/heroes/kld-card_uchet_officer13561337/\">УПК офицеров<\/a> · <a href=\"https://pamyat-naroda.ru/heroes/kld-card_ran87251725/\">картотека ранений<\/a> · <a href=\"https://pamyat-naroda.ru/heroes/podvig-chelovek_yubileinaya_kartoteka1523298007/\">юбилейная картотека, 06.04.1985<\/a> · <a href=\"https://pamyat-naroda.ru/heroes/person-hero99715162/\">однофамилец 1916 г. р.<\/a><\/p>", "docs": [{"id": "SCANS", "t": "Сохранённые сканы документов", "ref": "ЦГА Москвы, ЦГАМО, ЦАМО", "d": "", "url": "", "imgs": ["scans/cgamo-252-1-317-scan117-komarov-nikolay-1923.png", "scans/cgamo-252-1-317-scan117-parents.png", "scans/komarov-ne-1923-nagradnoy-list-full.jpg", "scans/komarov-ne-1923-nagradnoy-list-top.png"]}, {"id": "A-0008", "t": "Память народа: Комаров Николай Егорович 1923 — наградной лист (Орден Красной Звезды, 21.01.1945)", "ref": "приказ 8 гв. сд №06/н от 21.01.1945, стр. 13 из 132", "d": "1945-01-21", "url": "https://pamyat-naroda.ru/heroes/podvig-chelovek_nagrazhdenie36647968/", "imgs": []}, {"id": "A-0009", "t": "Память народа: Комаров Н. Е. — УПК офицеров и БД офицеров", "ref": "УПК", "d": "1941-10-29", "url": "https://pamyat-naroda.ru/heroes/kld-card_uchet_officer13561337/", "imgs": []}, {"id": "A-0010", "t": "Память народа: Комаров Н. Е. 1923 — картотека ранений (2 карточки) и юбилейная картотека 1985", "ref": "картотека общего учёта, ящ. 111-32; юбилейная — шк.27 ящ.15, док. №72 от 06.04.1985", "d": "1945–1985", "url": "https://pamyat-naroda.ru/heroes/kld-card_ran87251725/", "imgs": []}, {"id": "A-0012", "t": "Акт о рождении: Комаров Николай, 26.II.1923 (Рогачевский волисполком)", "ref": "ф.252 оп.1 д.317 скан 117, запись №115 (муж. №56)", "d": "1923-02-27", "url": "https://ya.ru/archive/catalog/778c6a12-fe44-447a-86a9-508d0725836d/117", "imgs": ["scans/A-0012-s117.jpg"]}], "sibs": []}, {"id": "elvira", "g": 4, "x": 790, "n": "Эльвина Иосифовна", "s": "Шутисс · 1925–1990", "st": "one", "c": "larisa", "unk": false, "name": "Комарова (Шутисс) Эльвина Иосифовна", "years": "1925 – 1990", "body": "\n        <p><b>Ваганьковское кладбище (30.10.2026).<\/b> Семья сообщила, что сёстры и их родители похоронены на Ваганьковском. В базе подписанных захоронений ГБУ «Ритуал» (открытые данные Москвы, поиск E-poisk) на одном участке найдены <b>Комарова Эльвина<\/b> (в записи годы 1925 и 1990) и <b>Шутисс Софья Васильевна<\/b> (годы 1908 и 1944). Во всей московской базе фамилия встречается только в написании «Шутисс», с двумя «с», как в военном списке 1946 года. Имя «Эльвина» верное: 2 ноября семья уточнила, что сестёр звали Эльвира и Эльвина (Эвелины не было), а мать Ларисы и Софьи — Эльвина. Год смерти 1990 сходится с тем, что она умерла до отъезда Софьи в США.<\/p>\n        <p class=\"flag\">С августа 2026 года сайт по требованию Роскомнадзора не показывает сами записи, только «есть совпадения» или «нет». Поэтому всё выше восстановлено по ответам на запросы с фильтрами (имя, годы, второй человек на участке, кладбище). Какой из двух годов год рождения, а какой — смерти, по таким ответам не отличить. Номер участка узнать не успел: после серии запросов сайт закрыл мне доступ. Отца Иосифа и сестру Эльвиру под фамилией Шутисс база не знает. Возможно, на памятнике их нет, или Эльвира записана под фамилией мужа. Проверить всё разом может фото памятника.<\/p>\n        <p>Мать Ларисы и Софьи. Сестра — Эльвира Шутис(с). Мать, по данным кладбища, — Софья Васильевна Шутисс. Родом из Литвы: Настя сначала назвала Латвию, но потом поправилась, и Михаил уверен, что это Литва. Как сёстры оказались в России, в семье не знают. Жила в Москве, там родились и выросли дочери. Умерла до отъезда Софьи в США, то есть раньше примерно 1991 года.<\/p>\n        <p><b>Сестра-сержант.<\/b> В списке демобилизованных из военкомата города Москвы есть запись «Шутисс Эльвира Иосиф. 1926 серж.»: сержант 1926 года рождения, выбыла по демобилизации 15 марта 1946 года. После уточнения семьи это, скорее всего, не мать, а её младшая сестра Эльвира. Отчество «Иосифовна» тогда общее для обеих сестёр.<\/p>\n        <p class=\"flag\">Отчество Эльвины прямо нигде не записано: «Иосифовна» взято из записи сестры Эльвиры. Обе — Шутисс, Москва, 1925 и 1926 годы. В строке списка нет места рождения, а часть страницы в базе закрыта. Отчество «Иосифовна» даёт кандидата в отцы только по имени. В картотеке офицеров есть Шутис Иосиф Иванович 1899 года рождения, старший лейтенант административной службы из 253-го запасного стрелкового полка, в армии с 1918 года, но связь с сёстрами ничем не подкреплена. <b>Новое (31.10):<\/b> 253-й запасной полк входил в 50-ю запасную «литовскую» стрелковую дивизию (1944–45, Литва), то есть Иосиф Иванович служил в литовской части. Это усиливает литовскую версию, но отцовство не доказывает.<\/p>\n        <p><b>Что говорит за Литву.<\/b> Шутис (Šutis) — настоящая литовская фамилия. В военных документах есть несколько литовцев с этой фамилией: Шутис Домас 1923 года рождения из Шяуляйского уезда (Папильская волость, деревня Лужишко), Шутис Иван Леонтьевич 1924 года из Кринчинского района Биржайского уезда, Шутис Езас Венцкович 1912 года. Обе местности на севере Литвы, у границы с Латвией, что может объяснить путаницу «Литва или Латвия». «Езас» — русская запись литовского имени Juozas, которое по-русски передают как Иосиф. Значит, отчество «Иосифовна» у литовки соответствует Juozo duktė, дочери Юозаса. По-литовски сёстры могли записываться Elvyra и Elvina Šutytė. Какая из этих семей её, неизвестно: нужен хотя бы уезд рождения.<\/p>\n        <p class=\"src\"><a href=\"https://pamyat-naroda.ru/heroes/rvk-chelovek_voenkomat407474/\">Список демобилизованных, ВК г. Москвы, док. от 14.06.1946, стр. 80<\/a> (inputs/pamyat-naroda/shutiss-elvira-demob-1946-*.png) · <a href=\"https://pamyat-naroda.ru/heroes/kld-card_uchet_officer9872517/\">Шутис Иосиф Иванович, УПК<\/a><\/p>\n        <p><b>Наводка предварительного поиска.<\/b> Фамилия Шутис в «Памяти народа» встречается (1 303 документа). Литовская группа связана с Биржайским уездом на севере Литвы: Шутис Иван Леонтьевич 1924 г. р. призван Кринчинским РВК. Есть и ленинградско-новгородская группа, например Шутис Клавдия Карловна 1922 г. р., уроженка Шимского района. Имена Эльвира и Эльвина для литовской католической деревни редкие. Они чаще встречаются у протестантов (в Биржайском крае много лютеран и реформатов) или у латышей. Это только направление, а не связь.<\/p>\n        <p>По-литовски фамилия, вероятно, пишется Šutis, а у женщин меняется окончание: незамужняя — Šutytė, замужняя — Šutienė. Для поиска по литовским метрикам нужно точное написание и хотя бы приход или уезд.<\/p>\n        <p class=\"src\"><a href=\"https://pamyat-naroda.ru/heroes/?adv_search=y&amp;last_name=%D0%A8%D1%83%D1%82%D0%B8%D1%81&amp;group=all\">Память народа — поиск «Шутис»<\/a><\/p><h4>Шутисс Эльвира Иосифовна<\/h4><p><b>02.11.2026, Ирина Ивановна:<\/b> Эльвира, возможно, родилась в Москве, а её мать Софья Шутис — в Литве или тоже в Москве.<\/p><p>Сестра Эльвины (раньше в древе ошибочно «Эвелина»; семья поправила 2 ноября). Вероятно, это сержант «Шутисс Эльвира Иосиф. 1926», демобилизованная военкоматом города Москвы 15 марта 1946 года. По словам семьи, похоронена на Ваганьковском вместе с сестрой и родителями. В базе кладбищ под фамилией Шутисс её нет, значит, на памятнике она, вероятно, под фамилией мужа. Её фамилия по мужу и потомки помогут найти общих родственников и семейные документы.<\/p><p class=\"src\"><a href=\"https://pamyat-naroda.ru/heroes/rvk-chelovek_voenkomat407474/\">Список демобилизованных, ВК г. Москвы, 1946<\/a><\/p>", "docs": [{"id": "SCANS", "t": "Сохранённые сканы документов", "ref": "ЦГА Москвы, ЦГАМО, ЦАМО", "d": "", "url": "", "imgs": ["scans/shutiss-elvira-demob-1946-row.png", "scans/shutiss-elvira-demob-1946-date.png"]}, {"id": "A-0007", "t": "Память народа: Шутисс Эльвира Иосифовна, список демобилизованных (ВК г. Москвы)", "ref": "список, стр. 80 из 87, док. 14.06.1946", "d": "1946-03-15", "url": "https://pamyat-naroda.ru/heroes/rvk-chelovek_voenkomat407474/", "imgs": []}, {"id": "A-0016", "t": "E-poisk «Поиск захоронений на территории г. Москва» (выгрузка открытых данных ГБУ «Ритуал», подписанные захоронения): ответы «есть/нет совпадений» на запросы с фильтрами", "ref": "ГБУ «Ритуал» (через epoisk.ru)", "d": "", "url": "https://epoisk.ru/burmsk/", "imgs": []}, {"id": "A-0032", "t": "Яндекс-архив: д. Телешова, крестьянин Егор Петров Комаров — восприемник, 1910", "ref": "ф.203 оп.780 д.4072 скан 117", "d": "1910", "url": "https://yandex.ru/archive/", "imgs": []}, {"id": "A-0047", "t": "Память народа: Шутис Иосиф Иванович 1899 (УПК); Зайчуки из Холымгородка/Халаим-Городка Таращанского р-на", "ref": "УПК офицерского состава", "d": "1918–1945", "url": "https://pamyat-naroda.ru/heroes/kld-card_uchet_officer9872517/", "imgs": []}, {"id": "A-0059", "t": "253 зсп = полк 50-й запасной «литовской» стрелковой дивизии (1944–45)", "ref": "ЦАМО (ПН) / Wikipedia (Pocius 1998)", "d": "1944–1946", "url": "https://pamyat-naroda.ru/warunit/id30000513/", "imgs": []}], "sibs": [{"n": "Эльвира", "d": "Эльвира — сестра · 1926?", "st": "one"}]}, {"id": "fedor", "g": 4, "x": 1210, "n": "Федор", "s": "Снимщиков · ум. ~1943", "st": "fam", "c": "ivan", "unk": false, "name": "Снимщиков Федор", "years": "прадед · ум. ~1943", "body": "\n        <p>Отец Ивана, Семена, Николая, Надежды, Ксении и Ольги; муж Елены Ивановны Коршиковой. Жил в Репецкой Плате. По словам Ирины Ивановны, не воевал: в 1941–1943 годах был на оккупированной территории и, по непроверенным слухам, погиб при освобождении (Курскую область освободили в начале 1943 года). Обстоятельства известны только по слухам и не проверялись. Отчество и год рождения неизвестны.<\/p>\n        <p class=\"flag\">В военных базах не найден (ОБД, «Память народа», Курская Книга памяти, послевоенный список погибших Репецко-Плотавского сельсовета). Версия «призван полевым военкоматом в 1943 году и погиб» не подтвердилась. Бои за село шли около 7 февраля 1943 года. Состав семьи с годами рождения есть в похозяйственных книгах сельсовета 1940–46 годов (запрос в архив).<\/p>\n        <p><b>Кандидат.<\/b> Федор Семенович из Репецкой Платы, родился около 1886 года: в 1915-м — младший унтер-офицер 314-го пехотного полка, ранен. Это единственный Федор подходящего возраста из этого села в военных базах. В 1941 году ему было бы около 55 лет, что согласуется с тем, что он не воевал. Документа о родстве нет.<\/p>\n        <p class=\"flag\"><b>Отвергнуты 02.11.2026.<\/b> Федор Васильевич 1909/1910 г. р. из Киева и его отец Василий Адрианович (прадед не воевал, а киевский Федор воевал до 1946 года); Федор Васильевич 1913–1984 с Хованского. Иван Федорович 1919, Александр Федорович 1921 и Дмитрий Федорович 1926 из Реплаты — не братья деда (дед родился в 1941/42, братьев с такими именами семья не называет); возможно, дальняя родня.<\/p>\n        <p class=\"src\">Ответы Ирины Ивановны, 02.11.2026 · <a href=\"https://gwar.mil.ru/heroes/chelovek_gospital20863774/\">GWAR: Федор Семенович 1915<\/a> · <a href=\"https://forum.vgd.ru/829/37066/\">ВГД: «Село Репецкая Плата»<\/a><\/p><p><b>Уточнение района (02.11).<\/b> По справочнику ГАКО Репецкая Плата с 1935 года в Мантуровском районе — события 1941–1943 искать в его фондах. Есть докладная Мантуровского райисполкома о зверствах оккупантов от 8 мая 1943 года (ГАКО Р-3605-1-269, л.15–19 об.), но её текст не опубликован онлайн: упоминается ли там Репецкая Плата или Снимщиковы — неизвестно. Ранние советские списки — фонд Верхосемского волисполкома (ГАКО Р-1221, 1919–1924), доступен в читальном зале.<\/p>", "docs": [{"id": "A-0022", "t": "Память народа: Снимщиков Федор Васильевич 24(25).04.1909, г. Киев — УПК (2), БД офицеров, картотека награждений, картотека ранений", "ref": "УПК; картотека награждений шк.81 ящ.6", "d": "1941–1972", "url": "https://pamyat-naroda.ru/heroes/person-hero92342539/", "imgs": []}, {"id": "A-0023", "t": "Память народа: другие Федоры Снимщиковы (31 док.): Федор Петрович 1922 Шебекинский р-н (уб. 27.11.1942); Федор Федорович 1896 (уб. 10.03.1942, Валуйки); Федор Иванович 1925; Яковлевич 1905 (Башкирия); Иванович 1900, Романович 1912 (Кубань)", "ref": "ЦАМО", "d": "1941–1945", "url": "https://pamyat-naroda.ru/heroes/?adv_search=y&last_name=Снимщиков&first_name=Федор", "imgs": []}, {"id": "A-0048", "t": "Мемориал (lists.memo.ru d30/f417, Wayback) + «Вся Москва» 1930 (РГБ, скан 159): Снимщиков Андрей Васильевич, 1904", "ref": "Мемориал; РГБ", "d": "1930-е", "url": "http://web.archive.org/web/2026id_/https://lists.memo.ru/d30/f417.htm", "imgs": []}, {"id": "A-0049", "t": "ГАКО ф.217 оп.3: метрические книги Архангельской ц. д. Репецкая Плата (каталог)", "ref": "ф.217 оп.3 д.1519 (1902–1905); д.1520 (1906–1909); д.1521 (1910–1913); также 1874–1895", "d": "1874–1913", "url": "https://nashipredki.com/church/4849", "imgs": []}, {"id": "A-0062", "t": "FamilySearch: МК Киев 1910 — рождение Феодора, сына Василия Адриановича Снимщикова (Тимский у., Верхосемская вол.)", "ref": "DGS 007810666 item 3 (Київ 1910), снимок 325 из 476, запись №100", "d": "10.IV.1910 (ст. ст.; = 23.IV н. ст.), крещ. 21.IV", "url": "https://www.familysearch.org/ark:/61903/1:1:6X7W-H8GJ", "imgs": []}, {"id": "A-0083", "t": "ЭБИД №365949: докладная исполкома Мантуровского райсовета о зверствах оккупантов, 08.05.1943", "ref": "ф.Р-3605 оп.1 д.269 л.15–19 об.", "d": "1943-05-08", "url": "https://docs.historyrussia.org/ru/nodes/365949", "imgs": []}, {"id": "A-0087", "t": "ГАКО, справочник адм.-терр. деления (Adm_del2.pdf), с.753: Репецкая Плата — 1934 Тимский р-н, с 1935 Мантуровский", "ref": "с.753", "d": "", "url": "https://archive.rkursk.ru/sites/default/files/documents/Adm_del2.pdf", "imgs": []}], "sibs": []}, {"id": "elena", "g": 4, "x": 1390, "n": "Елена Ивановна", "s": "Коршикова", "st": "fam", "c": "ivan", "unk": false, "name": "Снимщикова (Коршикова) Елена Ивановна", "years": "прабабушка · мать Ивана", "body": "<p>Мать Ивана и его братьев и сестёр, жена Федора. После войны с детьми переехала из Репецкой Платы в Луховицы, а затем, вслед за дочерью Надеждой, — в Фастов. Годы жизни неизвестны. Фамилия Коршиков чаще всего встречается в селе Большие Бутырки того же района; возможно, Елена родом оттуда (гипотеза).<\/p><p class=\"src\">Ответы Ирины Ивановны через Настю, 02.11.2026<\/p>", "docs": [], "sibs": []}, {"id": "pavel", "g": 4, "x": 1590, "n": "Павел Евсеевич", "s": "Зайчук · 1914 Красиловка", "st": "one", "c": "galina", "unk": false, "name": "Зайчук Павел Евсеевич", "years": "1914 · прадед", "body": "<p>Отец Галины. Родом из села <b>Красиловка<\/b> Таращанского уезда (около 60 км от Фастова), где жили его родные. Воевал: войну встретил во Львове, отступал, был контужен. В 1943 году в Орехово-Зуеве познакомился с Фёклой Николаевной и увёз её на Украину, где служил; в 1944 году служил в Казачьей Лопани Харьковской области. О войне никогда не рассказывал. Похоронен в Фастове.<\/p>\n        <p><b>Метрика.<\/b> Красиловка, 1914 год, запись №67 (сверена по скану): «Павелъ, род. 5 ноября… крестьянинъ села Красиловки Евсевій Игнатьевъ Зайчукъ и его законная жена Елисавета Даниловна». Отчество, село и год совпадают с рассказом семьи, так что это почти наверняка он. Родители венчались 31.I.1914: Евсевию был 21 год, Елисавете (урождённой Коритнюк) — 20. У Павла были сёстры Дария (1916) и София (1918). <\/p>\n        <p><b>Предки Павла (найдено 02.11.2026).<\/b> Метрика Красиловки 1893 года, рождения №22 (сверена по скану): <b>Евсевий родился 20 июня 1893 года<\/b>, родители — «крестьянинъ Игнатій Семеновъ Зайчукъ и его законная жена Ѳеодора Иванова». Так дед Павла <b>Игнатий Семенович<\/b> подтверждён документом. Мать Павла Елисавета в переписи 1897 года записана четырёхлетней дочерью <b>Даниила Тимофеевича Коритника<\/b> (45 лет), у неё брат Георгий (18). Это один источник, но семейный кластер совпадает. Поколением выше — гипотеза: в 1863 году в Красиловке крестили детей Василия и Павла Семеновичей Зайчуков, вероятно братьев Игнатия; их отец мог быть Семеон Климентьевич.<\/p>\n        <p class=\"flag\">В ОБД и «Подвиге народа» Павел Евсеевич не найден ни под одним вариантом написания (Евсиевич, Овсеевич, Заичук). В книгах ЗАГС Красилівки 1935–48 годов его тоже нет — ожидаемо, раз семья жила в Харьковской области и Фастове. В «Памяти народа» (02.11.2026, все типы документов) Павла Евсеевича тоже нет — только однофамильцы из Винницкой области. Акта о браке с Фёклой в книгах Фастова 1944–48 годов нет: брак, видимо, зарегистрирован позже, в другом месте или не регистрировался.<\/p>\n        <p class=\"src\">FamilySearch, Красиловка, Покровская церковь (DGS 005684908; 1893 — ЦДІАК 127-1078-2884, DGS 112826336) · перепись 1897 (ДАКО 384-11-17) · ответы Ирины Ивановны, 02.11.2026<\/p><p><b>Красиловка, 1876 (по внешнему отчёту, 02.11).<\/b> Книга Покровской церкви Красиловки за 1876 год лежит в деле ЦДІАК 127-1078-2750 (раньше было 2761), FamilySearch DGS 112318922, изображения 188–213; браки прочитаны не полностью. Брак Даниила Коритника там пока не найден, но и не исключён.<\/p>", "docs": [{"id": "A-0046", "t": "Яндекс-архив: Зайчуки — уроженцы Киевской губ., Таращанского у., Красиловской вол. (переселенцы)", "ref": "173-16-1115 (1899); 173-16-1538 (1903); 50-12-31 (1917)", "d": "1899–1917", "url": "https://yandex.ru/archive/search?text=Зайчук", "imgs": []}, {"id": "A-0047", "t": "Память народа: Шутис Иосиф Иванович 1899 (УПК); Зайчуки из Холымгородка/Халаим-Городка Таращанского р-на", "ref": "УПК офицерского состава", "d": "1918–1945", "url": "https://pamyat-naroda.ru/heroes/kld-card_uchet_officer9872517/", "imgs": []}, {"id": "A-0050", "t": "Wikimedia Commons: сканы актов ЗАГС г. Фастова 1944–1948 (ДАКО Р-5634 оп.1, 40 дел)", "ref": "Р-5634-1: браки 1944 д.3407, 1945 д.3704; рождения 1945 д.3693–3702; рождения 1944 д.3398–3401; прочие 1946–48", "d": "1944–1948", "url": "https://commons.wikimedia.org/w/index.php?search=Р-5634+Фастів&title=Special:MediaSearch&type=other", "imgs": []}, {"id": "A-0060", "t": "FamilySearch: МК с. Красиловка (Таращанский у.) 1914 — рождение Павла Евсеевича Зайчука", "ref": "группа «Красиловка, Попружна, Розумница … Красилівка 1914–1917», снимок 29 из 258, запись №67", "d": "5/6.XI.1914", "url": "https://www.familysearch.org/ark:/61903/1:1:6X7C-YLXY", "imgs": []}, {"id": "A-0061", "t": "FamilySearch индексы: прочие Зайчуки 1895–1925 (Красиловка, Рогозна, Халаимгородок)", "ref": "Ukraine, Kyiv, Orthodox Consistory Church Book Duplicates 1723-1931; Kyiv Confession Lists; Russia, Zhytomyr, Metrical Books 1795-1916", "d": "1895–1925", "url": "https://www.familysearch.org/en/search/record/results?q.surname=Зайчук&q.surname.exact=on&q.birthLikeDate.from=1895&q.birthLikeDate.to=1925", "imgs": []}], "sibs": []}, {"id": "fekla", "g": 4, "x": 1770, "n": "Фёкла Николаевна", "s": "Шарабарина · 1916", "st": "fam", "c": "galina", "unk": false, "name": "Шарабарина Фёкла Николаевна", "years": "1916 · прабабушка", "body": "<p>Мать Галины. Родилась в 1916 году в селе <b>Ясная Поляна<\/b> «Дмитровского района Курской области» (Дмитровский район входил в Курскую область в 1934–1937 годах, сейчас он в Орловской; какой именно — уточняется). Родители — <b>Николай Тимофеевич Шарабарин<\/b> (ум. 1972) и <b>Варвара «Анатольевна»<\/b>, фамилия неизвестна.<\/p>\n        <p>В 1943 году жила в Орехово-Зуеве, где познакомилась с Павлом Евсеевичем, и уехала с ним на Украину. Фамилию в браке, кажется, не меняла. Работала воспитателем в детском саду. Была замужем дважды, первый муж погиб на войне. Дочь Татьяна умерла в младенчестве. Похоронена в Фастове.<\/p>\n        <p><b>Где это.<\/b> «Дмитровский район» в семейном рассказе — почти наверняка <b>Дмитриевский<\/b> район (до 1920-х — уезд) Курской области. В военных базах Шарабарины записаны как раз оттуда: «Дмитриевский р-н, Фатеевский с/с, п. Ясная Поляна» и соседнее село Прабожье Поле. Посёлок Ясная Поляна, видимо, появился в 1920-е, так что в 1916 году Фёкла, скорее всего, родилась в Прабожьем Поле или Фатеевке.<\/p>\n        <p><b>Вероятный дядя.<\/b> Шарабарин <b>Лаврентий Тимофеевич<\/b>, уроженец Прабожьего Поля, призван 8.07.1941 Орехово-Зуевским военкоматом, жена Агриппина жила в Орехово-Зуеве; пропал без вести в декабре 1941 года. Отчество, село и Орехово-Зуево (где Фёкла жила в 1943-м) совпадают — вероятно, это брат Николая Тимофеевича. Лаврентий родился в 1902 году; его сын Михаил (1923, Прабожье) тоже призван из Орехово-Зуева. Значит, ещё до войны там жили по меньшей мере две семьи Шарабариных — скорее всего, уехали на фабрики, и Фёкла поехала к родне.<\/p>\n        <p><b>Вероятные братья.<\/b> Три Николаевича из Ясной Поляны и Фатеевского сельсовета: <b>Фрол<\/b> (1912, капитан «Смерш», пришёл из НКВД), <b>Семён<\/b> (15.03.1919, в 1939 году призван из Орехово-Зуева) и <b>Василий<\/b> (1927, умер от болезни 23.04.1945 в Тамбове). Отец ни в одном документе не назван, так что родство с Фёклой — гипотеза.<\/p>\n        <p class=\"flag\">«Анатольевна» — редкое отчество для крестьянки около 1890 года рождения; может оказаться Антоновной. Метрик за 1900–1917 годы онлайн нет; по описи ГАКО (ф. 217 оп. 3) книги ближайших приходов сохранились только за 1869–1894 годы. Рождение Фёклы — только запрос в ГАКО; ревизские сказки 1850 и 1858 годов — ф. 184 оп. 2 д. 849, 1009.<\/p>\n        <p class=\"src\">Ответы Ирины Ивановны через Настю, 02.11.2026 · <a href=\"https://obd-memorial.ru/html/info.htm?id=57820422\">ОБД: Шарабарин Лаврентий Тимофеевич<\/a> · <a href=\"https://nashipredki.com/church/4939\">Георгиевская церковь с. Прабожье Поле<\/a><\/p><p><b>Резерв для ранних поколений (02.11).<\/b> Найдены внутренние росписи многоприходных книг Дмитриевского уезда, где есть Георгиевская церковь Пробожьего Поля: ГАКО 217-1-980 (1841) и 217-1-967 (1833–1834). Пригодятся, когда будет известен отец Николая Тимофеевича.<\/p>", "docs": [{"id": "A-0050", "t": "Wikimedia Commons: сканы актов ЗАГС г. Фастова 1944–1948 (ДАКО Р-5634 оп.1, 40 дел)", "ref": "Р-5634-1: браки 1944 д.3407, 1945 д.3704; рождения 1945 д.3693–3702; рождения 1944 д.3398–3401; прочие 1946–48", "d": "1944–1948", "url": "https://commons.wikimedia.org/w/index.php?search=Р-5634+Фастів&title=Special:MediaSearch&type=other", "imgs": []}, {"id": "A-0084", "t": "vgd.ru: внутренние росписи многоприходных дел ГАКО 217-1-980 (1841) и 217-1-967 (1833–34) — Пробожье Поле, Георгиевская ц.", "ref": "ф.217 оп.1 д.980 (с изобр. 0); д.967 (с изобр. 489)", "d": "1833–1841", "url": "https://forum.vgd.ru/post/509/145499/p5513300.htm", "imgs": []}], "sibs": [{"n": "Фрол, Семён, Василий", "d": "Фрол, Семён, Василий — братья? · 1912–1927", "st": "hyp"}]}, {"id": "egor", "g": 5, "x": 498, "n": "Егор Петрович", "s": "Комаров · 1888", "st": "one", "c": "nikolay", "unk": false, "name": "Комаров Егор (Георгий) Петрович", "years": "22.XI.1888? – ?", "body": "\n        <p>Отец Николая Егоровича, крестьянин деревни Телешово Рогачёвской волости Дмитровского уезда. В феврале 1923 года ему 32 года. В 1920 году он заявлял о рождении близнецов Александра и Натальи, детей умершего Фёдора Комарова из той же деревни. Фёдор найден в метрике: он родился 15 апреля 1883 года у Петра Андреева и Натальи Евфимовой, то есть он родной брат Георгия 1888 года. Это ещё один довод, что Егор — тот самый Георгий. Книга браков Рогачёвской волости за 1920 год (июнь–декабрь) просмотрена целиком: брака Егора и Натальи Алексеевны там нет. Книги браков 1921–1922 годов не оцифрованы. В 1910 году Егор Петров Комаров из Телешова был крёстным (по указателю, скан не смотрел).<\/p>\n        <p><b>Вероятное крещение.<\/b> В метрической книге Скорбященской церкви села Ивановского за 1888 год, запись № 52: «Георгий. Деревни Телешова, крестьянин Петр Андреев Комаров и его законная жена Наталья Якимова, оба православные». Родился 22 ноября, крещён 23 ноября 1888 года (месяц определён по соседним записям; имя — к Егорию осеннему, 26 ноября). Восприемники — Василий Михайлов и девица Агапия Андреева из Телешова. Егор — бытовая форма имени Георгий.<\/p>\n        <p class=\"flag\">Что Егор 1923 года и Георгий 1888 года — один человек, пока гипотеза. Совпадают имя, отчество и деревня, но по акту 1923 года ему 32, то есть родился около 1890–1891, а не в 1888. Расхождение в 2–3 года для записей того времени обычное. <b>Проверено 30.10:<\/b> прочитаны все записи о рождении Ивановского прихода за 1889, 1890 и 1891 годы и об умерших за 1888–1890. Другого Георгия (Егора) у Петра Андреева нет, Георгий 1888 года в младенчестве не умер, а в феврале 1891 года у Петра и Натальи родилась дочь Евдокия (крёстные те же, что у Георгия). Других кандидатов не осталось, но прямого документа, связывающего Георгия 1888 года с Егором 1923 года, пока нет.<\/p>\n        <p class=\"src\"><a href=\"https://ya.ru/archive/catalog/778c6a12-fe44-447a-86a9-508d0725836d/117\">ЦГАМО ф.252 оп.1 д.317 ск.117<\/a> · <a href=\"https://ya.ru/archive/catalog/45021036-34d5-48ed-8ba1-ec3d5a52f56b/141\">ЦГА Москвы ф.203 оп.780 д.697 ск.141<\/a> (inputs/yandex-archive/cgam-203-780-697-scan141-georgiy-1888.png) · <a href=\"https://ya.ru/archive/catalog/6af32498-3dd1-4851-ab58-f4cd47022dab/49\">ЦГАМО ф.252 оп.1 д.248 ск.48–49<\/a><\/p><p><b>Семья брата Фёдора (сверено 02.11).<\/b> Метрика 1904 года (ЦГА Москвы 203-780-3264, скан 319, №47, по изображению): 26 ноября 1904 (ст. ст.) у «деревни Телешева крестьянина Ѳедора Петрова Комарова и его законной жены Маріи Васильевой» родился Василий. Крёстный — Василий Васильевич Крайнов из Оладьина, муж Анны Петровны Комаровой. В записи их брака (май 1903, ЦГА Москвы 203-780-3340, скан 177, сверено по изображению) невеста названа дочерью «деревни Телешова Петра Андреева Комарова», а поручителем с её стороны записан Фёдор Петров Комаров. Позже Фёдор сам крестил детей Крайновых. Такое взаимное кумовство — сильный довод, что это тот же Фёдор 1883 года, брат Егора. Прежняя запись «брак Фёдора в 1905 году с Татьяной Мухановой» оказалась ошибкой: в той метрике Фёдор и девица Татьяна — крёстные, а не жених и невеста. Вероятно, это тот самый Василий Фёдорович Комаров 1904 года из Телешова, ополченец 4-й дивизии народного ополчения: попал в плен 5 октября 1941 года под Ельней, умер в шталаге IV B 19 февраля 1942 года (ОБД «Мемориал» 300220441, 1150620862; жена Анастасия). Совпадают имя, отчество, год, деревня и число 26.11; слово «вероятно» остаётся, пока нет документа, прямо связывающего военного с метрикой.<\/p>", "docs": [{"id": "SCANS", "t": "Сохранённые сканы документов", "ref": "ЦГА Москвы, ЦГАМО, ЦАМО", "d": "", "url": "", "imgs": ["scans/cgam-203-780-697-scan141-georgiy-1888.png"]}, {"id": "A-0012", "t": "Акт о рождении: Комаров Николай, 26.II.1923 (Рогачевский волисполком)", "ref": "ф.252 оп.1 д.317 скан 117, запись №115 (муж. №56)", "d": "1923-02-27", "url": "https://ya.ru/archive/catalog/778c6a12-fe44-447a-86a9-508d0725836d/117", "imgs": ["scans/A-0012-s117.jpg"]}, {"id": "A-0014", "t": "Акты о рождении 1920: близнецы Комаровы Александр и Наталья, отец Федор (умер), мать Мария, д. Телешово; заявитель Егор Комаров", "ref": "ф.252 оп.1 д.248 скан 48-49", "d": "1920-08-18", "url": "https://ya.ru/archive/catalog/6af32498-3dd1-4851-ab58-f4cd47022dab/49", "imgs": ["scans/A-0014-s49.jpg"]}, {"id": "A-0015", "t": "Яндекс-архив, индексные наводки: Федор Петров Комаров д. Телешово (1908, Москва); Егор Петров Комаров д. Телешова (1910, восприемник); Анна Петрова Комарова, дочь Петра Андреева (брак 1903)", "ref": "ф.203 оп.782 д.308 ск.383; ф.203 оп.780 д.4072 ск.117; ф.203 оп.780 д.3340 ск.177", "d": "1903–1910", "url": "https://ya.ru/archive/search?text=Телешова Петр Комаров Георгий", "imgs": []}, {"id": "A-0036", "t": "Яндекс-архив: МК Ивановского прихода 1891, ч.1, февраль 2/3 — Евдокия, род. дер. Телешова кр. Петр Андреев и жена Наталья Евфимова [OCR; в 1888 — Якимова]; восприемники Василий Михайлов (Телешова) и кр. жена Агапия Андр[еева]", "ref": "ф.203 оп.780 д.2119 скан 352", "d": "1891", "url": "https://yandex.ru/archive/catalog/07174d5f-eacf-4fbd-a86c-14c499e095af/352", "imgs": ["scans/A-0036-s352.jpg"]}, {"id": "A-0037", "t": "Яндекс-архив: МК Ивановского прихода 1883, ч.1, апрель №17 — Ѳеодоръ, род. 15 / крещ. 16 IV, родители дер. Телешова кр. Петръ Андреевъ и законная жена Наталія Евфимова; восприемники: той же деревни солдат [Ни..?] Максимов и кр. девица Агафія Андреева", "ref": "ф.203 оп.780 д.639 скан 9, №17 муж.", "d": "1883-04-15", "url": "https://yandex.ru/archive/catalog/3e3ba902-5c91-4ed2-8bac-ebc7f6f1a47e/9", "imgs": ["scans/A-0037-s9.jpg"]}, {"id": "A-0038", "t": "Яндекс-архив: МК Ивановского прихода 1885, ч.1 — Анна, р мес. 21 дн.), дочь крестьянина д. Телешова Петра Андреева Комарова", "ref": "ф.203 оп.780 д.3340 скан 177", "d": "1903-05 (каталог 1903; OCR-заголовок «1907» ошибочен)", "url": "https://yandex.ru/archive/catalog/5ba23318-e5d3-4c7e-80d1-e27095e80652/177", "imgs": ["scans/A-0079-s177.jpg"]}, {"id": "A-0080", "t": "ОБД «Мемориал»: учётная карточка военнопленного Комаров Василий Федорович 26.11.1904", "ref": "ф.58 оп.977520 д.1988", "d": "1941–1942", "url": "https://obd-memorial.ru/html/info.htm?id=300220441", "imgs": []}, {"id": "A-0081", "t": "ОБД «Мемориал»: документы, уточняющие потери — Комаров Василий Федорович 1904, д. Телешево, пропал без вести 10.1941", "ref": "Отдел по гг. Химки, Долгопрудный, Лобня и Химкинскому р-ну, д.1", "d": "1941–194?", "url": "https://obd-memorial.ru/html/info.htm?id=1150620862", "imgs": []}, {"id": "A-0082", "t": "Книга памяти химкинского батальона 4-й ДНО (РМАТ, 2021), с.278", "ref": "с.278", "d": "2021", "url": "https://www.rmat.ru/wyswyg/file/2023_dokymentt/myze_06/kniga_pamti_compressed.pdf", "imgs": []}], "sibs": [{"n": "Татиана", "d": "Татиана — род. 1874", "st": "one"}, {"n": "Иван", "d": "Иван — род. 1877", "st": "one"}, {"n": "Фёдор", "d": "Фёдор — 1883–1920 · сын Василий", "st": "one"}, {"n": "Анна", "d": "Анна — 1885 · жена Крайнова", "st": "one"}, {"n": "Евдокия", "d": "Евдокия — род. 1891", "st": "one"}]}, {"id": "natalyaa", "g": 5, "x": 666, "n": "Наталья Алексеевна", "s": "Комарова · ок. 1902", "st": "one", "c": "nikolay", "unk": false, "name": "Комарова Наталья Алексеевна", "years": "ок. 1901–1902 – ?", "body": "<p>Мать Николая Егоровича, в феврале 1923 года ей 21 год, живёт в Телешове. Девичья фамилия неизвестна. Акты о браках Рогачёвской волости за 1920 год просмотрены, брака Егора Комарова там нет. Книги за 1921–1922 годы, видимо, не оцифрованы.<\/p><p class=\"src\">ЦГАМО ф.252 оп.1 д.317 ск.117; д.253 (браки 1920) — пусто<\/p>", "docs": [{"id": "A-0012", "t": "Акт о рождении: Комаров Николай, 26.II.1923 (Рогачевский волисполком)", "ref": "ф.252 оп.1 д.317 скан 117, запись №115 (муж. №56)", "d": "1923-02-27", "url": "https://ya.ru/archive/catalog/778c6a12-fe44-447a-86a9-508d0725836d/117", "imgs": ["scans/A-0012-s117.jpg"]}], "sibs": []}, {"id": "shutispar", "g": 5, "x": 860, "n": "Иосиф?", "s": "Шутисс · отец Эльвины", "st": "hyp", "c": "elvira", "unk": true, "name": "Иосиф?", "years": "", "body": "<p>Подробности — в общей карточке: <button type=\"button\" data-go=\"elvira\">Эльвина Иосифовна<\/button><\/p>", "docs": [], "sibs": []}, {"id": "sofyash", "g": 5, "x": 1030, "n": "Софья Васильевна", "s": "Шутисс · 1908–1944", "st": "one", "c": "elvira", "unk": false, "name": "Шутисс Софья Васильевна", "years": "1908? – 1944?", "body": "<p>Вероятная мать Эльвины и Эльвиры, прапрабабушка Насти. Похоронена на Ваганьковском, на одном участке с Комаровой Эльвиной. В базе захоронений с ней связаны годы 1908 и 1944. Скорее всего, она родилась в 1908 году и умерла в 1944-м, во время войны, когда Эльвине было 18–19 лет. Отчество Васильевна русское, так что она могла быть не литовкой: тогда литовец — отец, Иосиф (Юозас). Внучку, Софью Николаевну, вероятно, назвали в её честь.<\/p><p class=\"flag\">Если она родилась в 1908 году, Эльвину она родила в 17 лет. Это возможно, но годы надо проверить по памятнику или по акту о смерти 1944 года. Такой акт хранится в московском ЗАГСе, а со временем передаётся в ЦГА Москвы.<\/p><p class=\"src\">E-poisk / открытые данные ГБУ «Ритуал», 30.10.2026 (A-0016) · кладбище — со слов семьи<\/p>", "docs": [{"id": "A-0016", "t": "E-poisk «Поиск захоронений на территории г. Москва» (выгрузка открытых данных ГБУ «Ритуал», подписанные захоронения): ответы «есть/нет совпадений» на запросы с фильтрами", "ref": "ГБУ «Ритуал» (через epoisk.ru)", "d": "", "url": "https://epoisk.ru/burmsk/", "imgs": []}, {"id": "A-0086", "t": "Фотокопии указателя рождений Краснопресненского р-на 1924–1925 («код 52»), фото WP_20230904_291: строка «Шустис/Шутис» А.А.?, №134", "ref": "Р-3830? "Зайчук · 1840-е", "st": "hyp", "c": "ignat", "unk": false, "name": "Семеон Климентьевич?", "years": "", "body": "<p>Подробности — в общей карточке: <button type=\"button\" data-go=\"pavel\">Павел Евсеевич<\/button><\/p>", "docs": [], "sibs": []}, {"id": "pyotr", "g": 6, "x": 498, "n": "Пётр Андреевич", "s": "Комаров · ~1851", "st": "hyp", "c": "egor", "unk": false, "name": "Комаров Пётр Андреевич · Наталья Ефимовна", "years": "~1851 · ~1854; брак 1872", "body": "<p><b>Родители Андрея — найдены (31.10).<\/b> Брак 1837 года (Ивановское, Георгиевская церковь, запись сверена по скану): «Деревни Телешева крестьянина Якова Сергѣева сынъ Андрей Яковлевъ холостый съ дѣвицею раминской волости деревни Нижняго Крестьянина Ѳеодора Сѵмеонова съ дочерью его Маврою Ѳеодоровою». Поручитель по жениху — Павел Сильвестров из Гаврильцова, муж Ксении Яковлевой (вероятно, сестры Андрея). Андрей родился в 1818 году «у крестьянина Якова Сергеева» (крёстный — Герасим Сергеев, видимо, брат Якова). Яков Сергеев умер в ноябре 1843 года, 65 лет, «отъ престарѣлости»; его жена — Евфимия Андреевна. В исповедных ведомостях 1849 и 1851 годов Андрей (35 лет в 1851-м) с Маврой и детьми Устиньей, Иваном, Анной, Никитой живёт одним двором со старшим братом Ефимом Яковлевым (50 лет) — тем самым поручителем на свадьбе Петра в 1872 году.<\/p><p class=\"src\">ЦГА Москвы ф.203 оп.745 д.1447 ск.666 (брак 1837), ск.649; д.1151 ск.168 (рожд. 1818); д.1609 ск.848 (смерть 1843); оп.747 д.1618 ск.1479–1480 (1851), д.1575 ск.1477 (1849)<\/p><p><b>Брак (найден 30.10).<\/b> 5 ноября 1872 года в Скорбященской церкви села Ивановского обвенчаны: «ведомства Государственных имуществ деревни Телешева крестьянина Андрея Яковлева сын Петр Андреев», 21 год, первым браком, и «того же ведомства деревни Костюнина крестьянина Ефима Васильева дочь Наталия Ефимова», 18 лет, первым браком. Поручители по жениху — Ефим Яковлев из Телешева (вероятно, дядя жениха) и Козьма Иванов из Попихи, по невесте — Николай и Петр Павловы из Копылова. Запись сверена по скану. Значит, Пётр родился около 1851 года, Наталья — около 1854-го. В записи 1888 года её отчество написано «Якимова», в остальных — Ефимова/Евфимиева: это одна женщина.<\/p><p><b>Дети<\/b> (все — Ивановский приход): Татиана (род. 6 января 1874), Иоанн (род. 5 января 1877), Феодор (15 апреля 1883 – 1920), Анна (1885, замужем с 1903), Георгий (22 ноября 1888), Евдокия (2 февраля 1891). Крёстным Татианы и Иоанна был Алексей Ефимов из Костюнина — вероятно, брат Натальи. За 1878–1882 годы детей у них в книгах прихода не нашлось.<\/p><p><b>Братья и сёстры Петра — теперь по документам.<\/b> В 1877 году у Ивана Андреева и Феодоры Косьминой из Телешева крёстные — «брат его Петр Андреев и сестра девица Агафия Андреева»; в 1879-м снова «брат его Петр Андреев». В 1874 году у самого Петра крёстная — «сестра его девица Агафия Андреева». В 1873 году Агафья записана как «крестьянина Андрея Яковлева дочь».<\/p><p><b>Родители Петра.<\/b> Отец — Андрей Яковлев из Телешева, жив в 1873 году (был крёстным). Его жена в 1845–1851 годах — Мавра Федорова; их дети: Анна (род. 1 сентября 1845), Никита (1848), Феодосия (род. 20 мая 1850). Скорее всего, Мавра — мать Петра, но запись о рождении Петра (около 1851) пока не найдена, поэтому это не доказано. В 1851 году Андрей был крёстным вместе с «матерью его Евфимией Алексеевой» — это бабушка Петра, жена Якова. Сельцо Телешово в 1850-х — вотчина подполковника Резанова, к 1872 году крестьяне числятся в ведомстве государственных имуществ.<\/p><p class=\"flag\">Связь Петра с Егором Петровичем (1923) держится на гипотезе Егор = Георгий 1888 (см. карточку Егора). Сами Пётр, Наталья, их брак, дети, братья и сёстры Петра установлены по записям.<\/p><p class=\"src\"><a href=\"https://yandex.ru/archive/catalog/3ee41060-9abd-4ec5-b023-a32d3274676d/263\">Брак 1872: ф.203 оп.780 д.521 ск.263, № 16<\/a> · <a href=\"https://yandex.ru/archive/catalog/b4a279df-71a2-468f-8a2f-ab64d34c5f0d/194\">Татиана 1874: д.536 ск.194<\/a> · <a href=\"https://yandex.ru/archive/catalog/0ad137b4-442f-475f-bc4c-6cb34de8735a/188\">Иоанн 1877: д.566 ск.188<\/a> · <a href=\"https://yandex.ru/archive/catalog/0ad137b4-442f-475f-bc4c-6cb34de8735a/196\">брат Иван 1877: д.566 ск.196<\/a> · <a href=\"https://yandex.ru/archive/catalog/3174d462-5b5c-4309-ba3d-de56223918b4/1310\">Феодосия 1850: оп.745 д.1812А ск.1310<\/a> · Анна 1845: оп.745 д.1671 ск.376 · Никита 1848: оп.745 д.1756 ск.829 · Евфимия Алексеева 1851: оп.745 д.1835 ск.1272 · <a href=\"https://ya.ru/archive/catalog/45021036-34d5-48ed-8ba1-ec3d5a52f56b/141\">Георгий 1888: д.697 ск.141<\/a> · <a href=\"https://yandex.ru/archive/catalog/3e3ba902-5c91-4ed2-8bac-ebc7f6f1a47e/9\">Фёдор 1883: д.639 ск.9<\/a> · <a href=\"https://yandex.ru/archive/catalog/b8732768-0ee5-48cd-b96f-8c66506b82b8/259\">Анна 1885: д.661 ск.259<\/a><\/p>", "docs": [{"id": "A-0013", "t": "Метрика 1888: крещение Георгия, сына Петра Андреева Комарова (д. Телешово), Ивановское, Скорбященская ц.", "ref": "ф.203 оп.780 д.697 скан 141, ч.1 №52", "d": "1888", "url": "https://ya.ru/archive/catalog/45021036-34d5-48ed-8ba1-ec3d5a52f56b/141", "imgs": []}, {"id": "A-0015", "t": "Яндекс-архив, индексные наводки: Федор Петров Комаров д. Телешово (1908, Москва); Егор Петров Комаров д. Телешова (1910, восприемник); Анна Петрова Комарова, дочь Петра Андреева (брак 1903)", "ref": "ф.203 оп.782 д.308 ск.383; ф.203 оп.780 д.4072 ск.117; ф.203 оп.780 д.3340 ск.177", "d": "1903–1910", "url": "https://ya.ru/archive/search?text=Телешова Петр Комаров Георгий", "imgs": []}, {"id": "A-0036", "t": "Яндекс-архив: МК Ивановского прихода 1891, ч.1, февраль 2/3 — Евдокия, род. дер. Телешова кр. Петр Андреев и жена Наталья Евфимова [OCR; в 1888 — Якимова]; восприемники Василий Михайлов (Телешова) и кр. жена Агапия Андр[еева]", "ref": "ф.203 оп.780 д.2119 скан 352", "d": "1891", "url": "https://yandex.ru/archive/catalog/07174d5f-eacf-4fbd-a86c-14c499e095af/352", "imgs": ["scans/A-0036-s352.jpg"]}, {"id": "A-0037", "t": "Яндекс-архи ка или ошибка памяти. Каждое сведение сверено с тем, что нашлось в документах.<\/p>\n    <ul>\n      <li><b>Шутис — не опечатка.<\/b> Фамилия реально встречается у литовцев (Шяуляйский и Биржайский уезды). В найденном списке она написана с двумя «с» («Шутисс»). Искать нужно и так, а по-литовски — Šutis, у женщин Šutytė или Šutienė. Похожая фамилия Šutas (Шутас) — другая, но её стоит проверять как запасной вариант.<\/li>\n      <li><b>Литва или Латвия.<\/b> За Литву говорят литовские носители фамилии и отчество Иосифовна (Juozas). Найденные семьи жили у латвийской границы, а прадед воевал в Латвии, так что путаница понятна. Рабочая версия — Литва.<\/li>\n      <li><b>Девичья фамилия Ларисы.<\/b> В первом сообщении была «Снимщикова». Эта ошибка уже исправлена на «Комарова», и найденные документы с этим согласуются.<\/li>\n      <li><b>Николай Егорович из «Дмитровской области».<\/b> Такой области нет, есть Дмитровский район Московской области. Кандидат из документов родился именно там. Дмитровские районы есть также в Орловской и Курской областях, но подмосковная версия самая вероятная.<\/li>\n      <li><b>Снимщиков.<\/b> Редкая, но настоящая фамилия из Курской и Белгородской областей, так что семейная версия правдоподобна. В документах она искажается: Снимшиков, Снемщиков, Снамщиков. По-украински вероятно Снімщиков; если в Фастове есть документы, искать нужно и в таком написании.<\/li>\n      <li><b>Зайчук.<\/b> Распространённая украинская фамилия, особенно в Красиловке на Ставищенщине — оттуда и Павел Евсеевич. Ошибки в фамилии не видно.<\/li>\n      \n      <li><b>«Дмитровский район» Фёклы<\/b> — почти наверняка Дмитриевский район Курской области, где жили Шарабарины.<\/li>\n      <li><b>Эльвира и Эльвина — две сестры (решено 2.11).<\/b> В базе Ваганьковского кладбища — «Комарова Эльвина», в военном списке 1946 года — «Шутисс Эльвира». Это та же женщина, одно из написаний — ошибка или домашний вариант имени. Фамилия во всех документах пишется с двумя «с»: Шутисс.<\/li>\n      <li><b>Карелина, Фастов, Москва.<\/b> Противоречий с документами не найдено.<\/li>\n    <\/ul>\n  ", "sources": "\n    \n    <p class=\"lede\">Включая пустые маршруты, чтобы поиск можно было повторить. Рабочие файлы — в папке <a href=\"https://github.com/sokomishalov/komarova-genealogy\">репозитории<\/a>.<\/p>\n    <section>\n      <h3>Семейные материалы<\/h3>\n      <ul>\n        \n        \n      <\/ul>\n    <\/section>\n    <section>\n      <h3>Наводки предварительного поиска<\/h3>\n      <ul>\n        <li><a href=\"https://pamyat-naroda.ru/heroes/?adv_search=y&amp;last_name=%D0%A1%D0%BD%D0%B8%D0%BC%D1%89%D0%B8%D0%BA%D0%BE%D0%B2&amp;group=all\">Память народа — «Снимщиков»<\/a>: 1 137 документов, просмотрены 3 страницы; курские группы — Мантуровский/Антоновский, Великомихайловский, Шебекинский районы<\/li>\n        <li><a href=\"https://pamyat-naroda.ru/heroes/?adv_search=y&amp;last_name=%D0%A8%D1%83%D1%82%D0%B8%D1%81&amp;group=all\">Память народа — «Шутис»<\/a>: 1 303 документа, просмотрена 1 страница; литовская группа — Биржайский уезд<\/li>\n        <li><a href=\"https://familio.org/surnames/c4c84f56-0d04-4053-bd7a-fd5d4cc6e7bb\">Familio — фамилия Снимщиков<\/a>: Репецкая Плата (Курская губ.), Верхняя Вязовка (Оренбургская), Подхожее (Московская); сводные деревья, первоисточники не указаны<\/li>\n        <li><a href=\"https://nashipredki.com/location/repetskaya-plata-derevnya-39721\">НашиПредки — д. Репецкая Плата, Тимский уезд<\/a> · <a href=\"https://nashipredki.com/church/4849\">Архангельская церковь, метрики 1874–1913<\/a><\/li>\n        <li>Проверено, пусто (веб-поиск, 30.10.2026): «Снимщиков» + Фастов; «Снимщиков» + Курская область; «Зайчук» + Фастов; «Шутис» / Šutis / Szutis + Литва; Šutytė / Šutienė + Elvyra / Evelina<\/li>\n        <li>Недоступно 30.10.2026: базы «Мемориала» (base.memo.ru, lists.memo.ru) не открываются; «Открытый список» (openlist.wiki) требует входа; словарь литовских фамилий (pavardes.lki.lt) открывается только после принятия условий — не принимал их за вас<\/li>\n        <li>Проверено, пусто (30.10.2026): Find a Grave — Elvira Komarov(a), Shutis; «Память народа» — Шутис Эвелина, Комарова Эльвира, Шутите; Geneteka (Литва) — Szutis; веб-поиск — Juozas Šutis, Šutytė, Šutis + тремтис (высылка)<\/li>\n        <li><a href=\"https://epoisk.ru/burmsk/\">E-poisk — захоронения Москвы<\/a> (открытые данные ГБУ «Ритуал», записи скрыты): «Шутисс» — только Софья Васильевна (1908, 1944); на её участке Комарова Эльвина (1925, 1990); фильтр «Ваганьковское» — да. Шутис / Шутисс + Иосиф, Эвелина — нет. После серии запросов сайт закрыл доступ.<\/li>\n        <li>Яндекс-архив: «Шутисс», «Шутис Софья», «Шутис Эльвина», «Шутис Эвелина» — пусто. Попутно: в метрической книге московского костёла Петра и Павла за 1914 год (ЦГА Москвы ф.609 оп.2 д.102 ск.491) крёстным записан Викентий Шутис, крестьянин Поневежского уезда Ковенской губернии. Это доказывает, что литовцы Шутисы жили в Москве ещё до революции, но родство с Эльвирой не установлено.<\/li>\n        <li><a href=\"https://pamyat-naroda.ru/heroes/?adv_search=y&amp;last_name=%D0%A8%D1%83%D1%82%D0%B8%D1%81%D1%81&amp;group=all\">Память народа — «Шутисс»<\/a>: 15 документов, в том числе Шутис Домас 1923 (Шяуляйский уезд), Шутис Езас Венцкович 1912<\/li>\n      <\/ul>\n    <\/section>\n  "};
const NODES = DATA.nodes, byId = Object.fromEntries(NODES.map(n => [n.id, n]));
const ST = { doc: "подтверждено документами", one: "один документ", fam: "со слов семьи", hyp: "гипотеза", living: "живой человек — данные не публикуются" };
const W = 224, H = 78, SX = 1.62, GH = 150, MAXG = Math.max(...NODES.map(n => n.g));
const X = n => n.x * SX - W / 2, Y = n => (MAXG - n.g) * GH;
const NS = "http://www.w3.org/2000/svg", world = document.getElementById("world");
const el = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const female = n => /(вна|чна)$/.test(n.n.split(" ").slice(-1)[0]) || /^(Анна|Лидия|Ольга|Варвара|Мавра|Евфимия|Феодора|Елисавета|Наталья|Софья|Анастасия)\b/.test(n.n);
const couple = n => / и /.test(n.n);
const parents = id => NODES.filter(p => p.c === id);
function side(n) { let cur = n; while (cur && cur.g > 2) cur = byId[cur.c]; return cur && cur.g === 2 ? (cur.id === "igor" ? "по отцу" : "по матери") : ""; }
function kin(n) {
  if (n.g === 1) return "Настя";
  if (n.unk) return "неизвестны";
  if (n.g === 2) return female(n) ? "мама" : "папа";
  const pra = "пра".repeat(Math.max(0, n.g - 3));
  const base = couple(n) ? pra + (n.g === 3 ? "бабушка и дедушка" : "деды") : pra + (female(n) ? "бабушка" : "дедушка");
  return base + (side(n) ? " " + side(n) : "");
}
const GEN = g => g === 1 ? "Настя" : g === 2 ? "родители" : g === 3 ? "бабушки и дедушки" : g <= 6 ? "пра".repeat(g - 3) + "деды" : "пра×" + (g - 3) + " деды";

function draw() {
  const bg = el("g", {}, world), eg = el("g", {}, world), ng = el("g", {}, world);
  const minX = Math.min(...NODES.map(X)) - 210, maxX = Math.max(...NODES.map(X)) + W + 40;
  for (let g = 1; g <= MAXG; g++) {
    const y = (MAXG - g) * GH;
    el("rect", { class: "band", x: minX, y: y - 22, width: maxX - minX, height: H + 44, rx: 10 }, bg);
    el("text", { class: "band-n", x: minX + 16, y: y + 22 }, bg).textContent = g + "-е колено";
    el("text", { class: "band-r", x: minX + 16, y: y + 42 }, bg).textContent = GEN(g);
  }
  NODES.filter(n => n.c && byId[n.c]).forEach(p => {
    const c = byId[p.c], x1 = X(p) + W / 2, y1 = Y(p) + H, x2 = X(c) + W / 2, y2 = Y(c), my = y2 - 26;
    el("path", { d: `M${x1},${y1} V${my} H${x2} V${y2}`, class: "edge" + (p.st === "hyp" ? " hyp" : "") }, eg);
  });
  NODES.forEach(n => {
    const g = el("g", { class: `node ${n.st}`, transform: `translate(${X(n)},${Y(n)})`, tabindex: 0, role: "button", "aria-label": n.n, "data-id": n.id }, ng);
    el("rect", { class: "card", width: W, height: H, rx: 7 }, g);
    el("circle", { class: "gen", cx: W - 15, cy: 15, r: 10 }, g);
    el("text", { class: "gent", x: W - 15, y: 19, "text-anchor": "middle" }, g).textContent = n.g;
    el("text", { class: "nm", x: 12, y: 23 }, g).textContent = n.n.length > 24 ? n.n.slice(0, 23) + "…" : n.n;
    const sub = n.s.length > 32 ? n.s.slice(0, 31) + "…" : n.s;
    el("text", { class: "sb", x: 12, y: 42 }, g).textContent = sub;
    const meta = [];
    if (n.docs.length) meta.push("▤ " + n.docs.length);
    if (n.sibs.length) meta.push("⚭ " + n.sibs.length);
    el("text", { class: "meta", x: 12, y: 64 }, g).textContent = n.st === "living" ? "жив(а)" : meta.join("   ");
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(n.id, true); } });
  });
}

const svg = document.getElementById("svg"), stage = document.getElementById("stage");
let view = { x: 0, y: 0, k: 1 };
const apply = () => world.setAttribute("transform", `translate(${view.x},${view.y}) scale(${view.k})`);
const clampK = k => Math.min(3, Math.max(0.12, k));
function zoomAt(f, cx, cy) { const k = clampK(view.k * f); f = k / view.k; view.x = cx - (cx - view.x) * f; view.y = cy - (cy - view.y) * f; view.k = k; apply(); }
function fit() { const b = world.getBBox(), r = svg.getBoundingClientRect(), pad = 24;
  const k = clampK(Math.min((r.width - pad * 2) / b.width, (r.height - pad * 2) / b.height));
  view.k = k; view.x = (r.width - b.width * k) / 2 - b.x * k; view.y = (r.height - b.height * k) / 2 - b.y * k; apply(); }
function centerOn(id, k) { const n = byId[id], r = svg.getBoundingClientRect(); if (k) view.k = k;
  view.x = r.width / 2 - (X(n) + W / 2) * view.k; view.y = r.height / 2 - (Y(n) + H / 2) * view.k; apply(); }
svg.addEventListener("wheel", e => { e.preventDefault(); const r = svg.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
const ptrs = new Map(); let moved = 0, pinch = null, downNode = null;
svg.addEventListener("pointerdown", e => { svg.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); moved = 0;
  downNode = e.target.closest(".node"); if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) }; } stage.classList.add("dragging"); });
svg.addEventListener("pointermove", e => { if (!ptrs.has(e.pointerId)) return; const prev = ptrs.get(e.pointerId), cur = { x: e.clientX, y: e.clientY }; ptrs.set(e.pointerId, cur);
  if (ptrs.size === 2 && pinch) { const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y), r = svg.getBoundingClientRect();
    zoomAt(d / pinch.d, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top); pinch.d = d; moved += 10; return; }
  const dx = cur.x - prev.x, dy = cur.y - prev.y; moved += Math.abs(dx) + Math.abs(dy); view.x += dx; view.y += dy; apply(); });
const up = e => { if (!ptrs.has(e.pointerId)) return; ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null;
  if (!ptrs.size) { stage.classList.remove("dragging"); if (moved < 6 && downNode) select(downNode.dataset.id, false); } };
svg.addEventListener("pointerup", up); svg.addEventListener("pointercancel", up);
const mid = () => { const r = svg.getBoundingClientRect(); return [r.width / 2, r.height / 2]; };
document.getElementById("zin").onclick = () => zoomAt(1.25, ...mid());
document.getElementById("zout").onclick = () => zoomAt(0.8, ...mid());
document.getElementById("zfit").onclick = fit;
document.getElementById("zme").onclick = () => { centerOn("nastya", 1); select("nastya", false); };

const panel = document.getElementById("panel");
function intro() {
  const n = NODES.length, docs = NODES.reduce((s, x) => s + x.docs.length, 0);
  panel.innerHTML = `<div class="eyebrow">Как читать</div><h2>Древо по документам</h2>
    <p class="note">${n} карточек, ${docs} привязанных документов. Колено считается от Насти: она — 1-е, родители — 2-е, бабушки и дедушки — 3-е.</p>
    <p class="note">Рамка карточки показывает, насколько доказан человек: сплошная — документами, синяя — одним документом, штрихи — со слов семьи, точки — гипотеза. Живые показаны только именем.</p>
    <p class="note">Колесо или щипок — масштаб, перетаскивание — сдвиг, клик — карточка человека. Кнопка «Н» возвращает к Насте.</p>`;
}
function relHtml(n) {
  const par = parents(n.id), kid = n.c && byId[n.c] ? [byId[n.c]] : [];
  const grp = (label, arr) => arr.length ? `<div class="sec"><h3>${label}</h3><div class="rel">${arr.map(a => `<button type="button" data-go="${a.id}">${esc(a.n)}</button>`).join("")}</div></div>` : "";
  return grp("Родители", par) + grp("Ребёнок по прямой линии", kid);
}
function select(id, center) {
  document.querySelectorAll(".node.sel").forEach(x => x.classList.remove("sel"));
  document.querySelector(`.node[data-id="${id}"]`)?.classList.add("sel");
  const n = byId[id]; if (center) centerOn(id);
  const sibs = n.sibs.length ? `<div class="sec"><h3>Братья и сёстры</h3><div class="sibs">${n.sibs.map(s => `<span title="${esc(s.d)}">${esc(s.n)}</span>`).join("")}</div>
    ${n.sibs.some(s => s.d) ? `<ul class="note">${n.sibs.filter(s => s.d).map(s => `<li>${esc(s.d)}</li>`).join("")}</ul>` : ""}</div>` : "";
  const docs = n.docs.length ? `<div class="sec"><h3>Документы · ${n.docs.length}</h3><div class="docs">${n.docs.map(d => `<div class="doc"><span class="t">${esc(d.t)}</span>
      <span class="r">${esc([d.d, d.ref].filter(Boolean).join(" · "))}</span>
      ${d.imgs.length ? `<div class="th">${d.imgs.map((im, i) => `<button type="button" data-doc="${d.id}" data-i="${i}" aria-label="Открыть скан"><img src="${im}" alt="" loading="lazy"></button>`).join("")}</div>` : ""}
      ${d.url ? `<a href="${esc(d.url)}" target="_blank" rel="noopener">Открыть источник ↗</a>` : ""}</div>`).join("")}</div></div>` : "";
  panel.innerHTML = `<div class="eyebrow">Карточка · ${n.g}-е колено</div><h2>${esc(n.name)}</h2>${n.years ? `<div class="years">${esc(n.years)}</div>` : ""}
    <div class="kin"><b>${n.g}-е колено</b> · ${esc(kin(n))}</div><span class="chip st-${n.st}">${ST[n.st] || n.st}</span>
    ${n.st === "living" ? `<p class="note sec">Живые родственники показаны только именем: даты, места и документы о них не публикуются.</p>` : `<div class="sec body">${n.body}</div>`}
    ${relHtml(n)}${sibs}${docs}`;
  panel.scrollTop = 0;
  panel.querySelectorAll("[data-go]").forEach(b => b.onclick = () => select(b.dataset.go, true));
  panel.querySelectorAll("[data-doc]").forEach(b => b.onclick = () => openDoc(n, b.dataset.doc, +b.dataset.i));
  panel.querySelectorAll(".body a").forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
}

const lb = document.getElementById("lb");
function openDoc(n, id, i) {
  const d = n.docs.find(x => x.id === id);
  document.getElementById("lb-t").textContent = d.t;
  document.getElementById("lb-pic").innerHTML = `<img src="${d.imgs[i]}" alt="Скан: ${esc(d.t)}">`;
  document.getElementById("lb-f").innerHTML = `<code>${esc(d.ref)}</code>${d.url ? `<a href="${esc(d.url)}" target="_blank" rel="noopener">Открыть в источнике ↗</a>` : ""}`;
  lb.hidden = false; document.getElementById("lb-x").focus();
}
document.getElementById("lb-x").onclick = () => lb.hidden = true;
lb.addEventListener("click", e => { if (e.target === lb) lb.hidden = true; });

const rd = document.getElementById("reading");
const openReading = (h, b) => { document.getElementById("rd-h").textContent = h; document.getElementById("rd-b").innerHTML = b;
  rd.querySelectorAll("a").forEach(a => { a.target = "_blank"; a.rel = "noopener"; }); rd.hidden = false; rd.scrollTop = 0; };
document.getElementById("open-gaps").onclick = () => openReading("Пробелы", DATA.gaps);
document.getElementById("open-src").onclick = () => openReading("Все источники", DATA.sources);
document.getElementById("rd-x").onclick = () => rd.hidden = true;
document.addEventListener("keydown", e => { if (e.key === "Escape") { lb.hidden = true; rd.hidden = true; } });

const root = document.documentElement;
function setTheme(t) { if (t === "system") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", t);
  document.querySelectorAll("[data-t]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.t === t)));
  try { localStorage.setItem("komarova-theme", t); } catch (e) {} }
document.querySelectorAll("[data-t]").forEach(b => b.onclick = () => setTheme(b.dataset.t));
let saved = null; try { saved = localStorage.getItem("komarova-theme"); } catch (e) {}
setTheme(saved || "system");

draw(); intro();
requestAnimationFrame(() => { if (svg.getBoundingClientRect().width < 640) centerOn("nastya", 0.9); else fit(); });
</script>
</body>
</html>
